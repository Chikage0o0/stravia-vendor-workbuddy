[package]
name = "stravia-vendor-workbuddy"
version = "0.1.2"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "WorkBuddy China and international vendor component for Stravia"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stravia-vendor-sdk = { git = "https://github.com/Stravia-AI/StraviaPlatform.git", rev = "25a21676ba2e5cd9989479972c70d32f1ca11f4a" }
stravia-vendor-common = { git = "https://github.com/Stravia-AI/StraviaPlatform.git", rev = "25a21676ba2e5cd9989479972c70d32f1ca11f4a" }
stravia-runtime-contract = { git = "https://github.com/Stravia-AI/StraviaPlatform.git", rev = "25a21676ba2e5cd9989479972c70d32f1ca11f4a" }
stravia-protocol-codec = { git = "https://github.com/Stravia-AI/StraviaPlatform.git", rev = "25a21676ba2e5cd9989479972c70d32f1ca11f4a" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
semver = { version = "1", features = ["serde"] }
base64 = "0.23"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
stravia-vendor-runtime = { git = "https://github.com/Stravia-AI/StraviaPlatform.git", rev = "25a21676ba2e5cd9989479972c70d32f1ca11f4a" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
parking_lot = "0.12"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"

[package.metadata.component]
package = "stravia:vendor"
