version: '3'

vars:
  WASM: target/wasm32-wasip2/release/stravia_vendor_workbuddy.wasm

tasks:
  default:
    deps: [dist]

  build:
    desc: 构建 wasm32-wasip2 release 组件
    cmds:
      - cargo build --locked --release --lib --target wasm32-wasip2 --target-dir target

  test:
    desc: 单元回归与组件契约验证（契约测试加载 release wasm，须先构建）
    deps: [build]
    cmds:
      - cargo test --locked --lib --target-dir target
      - cargo test --locked --test component_contract --target-dir target -- --ignored --nocapture

  verify-shape:
    desc: 使用匹配的宿主工具离线验证组件与冷连接 fixture
    deps: [build]
    requires:
      vars: [STRAVIA_TOOLS]
    cmds:
      - '"{{.STRAVIA_TOOLS}}" verify-egress-shape --component "{{.WASM}}" --shape plugin:workbuddy --fixture tests/fixtures/workbuddy-windows-main.json --server-name www.workbuddy.cn'

  verify:
    desc: 构建并执行全部验证
    deps: [test]
    cmds:
      - task: verify-shape

  dist:
    desc: 构建并生成签名插件目录与发布资产
    deps: [build]
    cmds:
      - python3 scripts/dist.py
